name: snap_puzzle
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.2.0
  image: ^4.5.4
  path_provider: ^2.1.5
  confetti: ^0.8.0
  audioplayers: ^6.0.0
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  shared_preferences: ^2.5.3
  vibration: ^3.1.3
  google_mobile_ads: ^5.3.1
  google_sign_in: ^6.3.0
  marquee: ^2.3.0
  url_launcher: ^6.3.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/puzzles/
    - assets/sounds/
    - assets/pr_img/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
