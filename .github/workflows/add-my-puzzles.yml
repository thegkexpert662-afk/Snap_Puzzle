name: Add My Puzzles resume

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch files
        run: python3 .github/scripts/patch_my_puzzles.py
      - name: Commit code changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/home_screen.dart lib/screens/puzzle_screen.dart lib/screens/asset_puzzle_screen.dart
          git diff --cached --quiet && exit 0
          git commit -m "Save and resume unfinished puzzles"
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/add-my-puzzles.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Remove temporary puzzle resume workflow" && git push)
