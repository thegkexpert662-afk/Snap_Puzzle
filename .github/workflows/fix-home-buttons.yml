name: Apply Home Button Fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Fix Leaderboard Responsive UI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix leaderboard responsive layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('lib/screens/leaderboard_screen.dart')
          s = p.read_text()

          header = r'''  Widget _header(BuildContext context) {
            return Row(
              crossAxisAlignment: CrossAxisAlignment.center,
              children: [
                _CircleButton(
                  icon: Icons.arrow_back_rounded,
                  onTap: () => Navigator.pop(context),
                ),
                const SizedBox(width: 10),
                const Icon(
                  Icons.emoji_events_rounded,
                  color: Color(0xFFFFB928),
                  size: 54,
                ),
                const SizedBox(width: 8),
                const Expanded(
                  child: Column(
                    mainAxisSize: MainAxisSize.min,
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      FittedBox(
                        fit: BoxFit.scaleDown,
                        alignment: Alignment.centerLeft,
                        child: Text.rich(
                          TextSpan(
                            children: [
                              TextSpan(
                                text: 'Global ',
                                style: TextStyle(color: Colors.white),
                              ),
                              TextSpan(
                                text: 'Leaderboard',
                                style: TextStyle(color: Color(0xFFFFD42A)),
                              ),
                            ],
                          ),
                          maxLines: 1,
                          style: TextStyle(
                            fontSize: 25,
                            fontWeight: FontWeight.w900,
                            height: 1,
                          ),
                        ),
                      ),
                      SizedBox(height: 7),
                      Text(
                        'Top Players from Around the World',
                        maxLines: 2,
                        overflow: TextOverflow.ellipsis,
                        style: TextStyle(
                          color: Color(0xFFB8D4FF),
                          fontSize: 12,
                          fontWeight: FontWeight.w600,
                          height: 1.25,
                        ),
                      ),
                    ],
                  ),
                ),
                const SizedBox(width: 8),
                const Icon(
                  Icons.public_rounded,
                  color: Color(0xFF19C7FF),
                  size: 52,
                ),
              ],
            );
          }
'''

          player = r'''class _PlayerCard extends StatelessWidget {
            final int rank;
            final Map<String, dynamic> data;

            const _PlayerCard({required this.rank, required this.data});

            @override
            Widget build(BuildContext context) {
              final first = rank == 1;
              final second = rank == 2;
              final third = rank == 3;
              final bg = first
                  ? const [Color(0xFFFF2D91), Color(0xFFB90062)]
                  : second
                      ? const [Color(0xFF138FF5), Color(0xFF0750B8)]
                      : third
                          ? const [Color(0xFFFF7414), Color(0xFFC84608)]
                          : const [Color(0xFF123F85), Color(0xFF08265A)];
              final border = first
                  ? const Color(0xFFFF45B0)
                  : second
                      ? const Color(0xFF18A9FF)
                      : third
                          ? const Color(0xFFFF8622)
                          : const Color(0xFF126CC7);
              final badge = first
                  ? '👑 Legend'
                  : second
                      ? '★ Pro'
                      : third
                          ? '★ Rising Star'
                          : '★ Player';

              return Container(
                padding: const EdgeInsets.fromLTRB(12, 14, 12, 15),
                decoration: BoxDecoration(
                  gradient: LinearGradient(
                    begin: Alignment.topLeft,
                    end: Alignment.bottomRight,
                    colors: bg,
                  ),
                  borderRadius: BorderRadius.circular(28),
                  border: Border.all(color: border, width: 2),
                  boxShadow: [
                    BoxShadow(
                      color: bg.first.withOpacity(.35),
                      blurRadius: 18,
                      offset: const Offset(0, 8),
                    ),
                  ],
                ),
                child: Column(
                  children: [
                    if (first)
                      const Align(
                        alignment: Alignment.topRight,
                        child: _WorldNumber(),
                      )
                    else
                      const SizedBox(height: 4),
                    const SizedBox(height: 4),
                    LayoutBuilder(
                      builder: (context, constraints) {
                        final compact = constraints.maxWidth < 390;
                        return Row(
                          crossAxisAlignment: CrossAxisAlignment.center,
                          children: [
                            _Rank(rank: rank),
                            const SizedBox(width: 7),
                            const _Avatar(),
                            const SizedBox(width: 9),
                            Expanded(
                              child: Column(
                                mainAxisSize: MainAxisSize.min,
                                crossAxisAlignment: CrossAxisAlignment.start,
                                children: [
                                  Text(
                                    data['name']?.toString() ?? 'Unknown Player',
                                    maxLines: 1,
                                    overflow: TextOverflow.ellipsis,
                                    style: const TextStyle(
                                      color: Colors.white,
                                      fontSize: 19,
                                      fontWeight: FontWeight.w900,
                                    ),
                                  ),
                                  const SizedBox(height: 6),
                                  _Info(
                                    icon: Icons.badge_rounded,
                                    color: const Color(0xFFE34AFF),
                                    text: data['playerId']?.toString() ?? '--',
                                  ),
                                  const SizedBox(height: 5),
                                  _Info(
                                    icon: Icons.timer_rounded,
                                    color: Colors.white,
                                    text: '${data['bestTime'] ?? 0} sec',
                                  ),
                                  const SizedBox(height: 6),
                                  Align(
                                    alignment: Alignment.centerLeft,
                                    child: Container(
                                      constraints: BoxConstraints(
                                        maxWidth: compact ? 115 : 150,
                                      ),
                                      padding: const EdgeInsets.symmetric(
                                        horizontal: 10,
                                        vertical: 5,
                                      ),
                                      decoration: BoxDecoration(
                                        color: Colors.black.withOpacity(.2),
                                        borderRadius: BorderRadius.circular(18),
                                        border: Border.all(
                                          color: first || third
                                              ? const Color(0xFFFFC91B)
                                              : const Color(0xFF2FE7FF),
                                          width: 1.7,
                                        ),
                                      ),
                                      child: Text(
                                        badge,
                                        maxLines: 1,
                                        overflow: TextOverflow.ellipsis,
                                        textAlign: TextAlign.center,
                                        style: TextStyle(
                                          color: first || third
                                              ? const Color(0xFFFFF3A0)
                                              : const Color(0xFFB8F6FF),
                                          fontSize: 11,
                                          fontWeight: FontWeight.w900,
                                        ),
                                      ),
                                    ),
                                  ),
                                ],
                              ),
                            ),
                            const SizedBox(width: 7),
                            SizedBox(
                              width: compact ? 78 : 88,
                              child: Column(
                                mainAxisSize: MainAxisSize.min,
                                children: [
                                  const Icon(
                                    Icons.emoji_events_rounded,
                                    color: Color(0xFFFFD13A),
                                    size: 38,
                                  ),
                                  const SizedBox(height: 3),
                                  Container(
                                    width: double.infinity,
                                    padding: const EdgeInsets.symmetric(
                                      horizontal: 6,
                                      vertical: 9,
                                    ),
                                    decoration: BoxDecoration(
                                      color: Colors.black.withOpacity(.22),
                                      borderRadius: BorderRadius.circular(18),
                                      border: Border.all(
                                        color: Colors.white12,
                                        width: 2,
                                      ),
                                    ),
                                    child: FittedBox(
                                      fit: BoxFit.scaleDown,
                                      child: Text(
                                        '${data['totalScore'] ?? 0}',
                                        textAlign: TextAlign.center,
                                        style: const TextStyle(
                                          color: Color(0xFFFFE01B),
                                          fontSize: 21,
                                          fontWeight: FontWeight.w900,
                                        ),
                                      ),
                                    ),
                                  ),
                                ],
                              ),
                            ),
                          ],
                        );
                      },
                    ),
                  ],
                ),
              );
            }
          }

'''

          s = re.sub(r"  Widget _header\(BuildContext context\) \{.*?^\}\n\nclass _PlayerCard", header + "class _PlayerCard", s, count=1, flags=re.S|re.M)
          s = re.sub(r"class _PlayerCard extends StatelessWidget \{.*?^class _Rank", player + "class _Rank", s, count=1, flags=re.S|re.M)
          s = s.replace("fontSize: 12,\n              fontWeight: FontWeight.w600,", "fontSize: 11,\n              fontWeight: FontWeight.w600,")
          p.write_text(s)
          PY
      - name: Commit code and remove temporary workflows
        run: |
          rm -f .github/workflows/fix-home-buttons.yml .github/workflows/fix-leaderboard-ui.yml LEADERBOARD_UI_TRIGGER.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/leaderboard_screen.dart .github/workflows/fix-home-buttons.yml .github/workflows/fix-leaderboard-ui.yml LEADERBOARD_UI_TRIGGER.md
          git commit -m "Fix Leaderboard Responsive UI"
          git push
