name: Fix Home Header

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix Home header alignment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move coins and settings to right
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/home_screen.dart')
          s = p.read_text()
          old = "        const SizedBox(width: 12),\n       \n        _buildCoinPill(),"
          new = "        const SizedBox(width: 12),\n        const Spacer(),\n\n        _buildCoinPill(),"
          if old not in s:
              raise SystemExit('Header pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm -f .github/workflows/fix-home-header.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/home_screen.dart .github/workflows/fix-home-header.yml
          git commit -m "Fix Home header alignment"
          git push
