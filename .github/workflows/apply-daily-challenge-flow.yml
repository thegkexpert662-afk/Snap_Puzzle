name: Apply Daily Challenge Flow

on:
  push:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Daily Challenge navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/home_screen.dart')
          s = p.read_text()
          old = "onTap: () => _showMessage('🚀 Daily Challenge - Coming Soon')"
          new = "onTap: () => Navigator.push(context, MaterialPageRoute(builder: (_) => const AssetImageSelectionScreen()))"
          if old not in s:
              raise SystemExit('Daily Challenge handler not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/apply-daily-challenge-flow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/home_screen.dart .github/workflows/apply-daily-challenge-flow.yml
          git commit -m "Route Daily Challenge to Assets puzzle flow"
          git push
